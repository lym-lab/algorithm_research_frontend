# Small experiment: wc6 settings, 5k steps from scratch, to check the loss before the real run
name: g22
steps: 5000
adv: true
adv_lambda: 0.1
clf_lr: 0.0001
crop_s: 10.0
batch: 16
warmup: 4000
grad_clip: 1.0
target_recon: 0.2
valid_utts: 200
model: {feat_dim: 1024, d: 512, enc_layers: 4, dec_layers: 6, heads: 2, filt: 1024, dropout: 0.2}
